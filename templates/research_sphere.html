  <style>
    /* THEME ENGINE STYLES */
    html.dark body {
      background-color: #08080b;
      color: #f1f1f5;
      background-image: 
        radial-gradient(at 0% 0%, rgba(212, 175, 55, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(70, 80, 120, 0.08) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(20, 21, 27, 0.9) 0px, transparent 100%);
    }

    html.light body {
      background-color: #fcfbfa;
      color: #17181c;
      background-image: 
        radial-gradient(at 0% 0%, rgba(212, 175, 55, 0.06) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(220, 200, 160, 0.1) 0px, transparent 50%);
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-attachment: fixed;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* CARD STYLES */
    .dark .glass-card {
      background: rgba(18, 19, 25, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .dark .glass-card:hover {
      border-color: rgba(212, 175, 55, 0.45);
      box-shadow: 0 12px 40px rgba(212, 175, 55, 0.08);
    }

    .light .glass-card {
      background: #ffffff;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 16px;
      box-shadow: 0 4px 20px 0 rgba(184, 134, 11, 0.04);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .light .glass-card:hover {
      border-color: rgba(212, 175, 55, 0.6);
      box-shadow: 0 10px 30px rgba(184, 134, 11, 0.1);
    }

    /* BUTTONS */
    .btn-gold {
      background: linear-gradient(135deg, #d4af37, #b8860b);
      color: #08080b;
      font-weight: 700;
      border-radius: 10px;
      padding: 8px 16px;
      border: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 3px 14px rgba(212, 175, 55, 0.3);
    }
    .btn-gold:hover {
      background: linear-gradient(135deg, #eac459, #d4af37);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.45);
    }

    .btn-outline-gold {
      background: transparent;
      color: #d4af37;
      border: 1px solid rgba(212, 175, 55, 0.5);
      font-weight: 600;
      border-radius: 10px;
      padding: 8px 14px;
      transition: all 0.2s ease;
    }
    .btn-outline-gold:hover {
      background: rgba(212, 175, 55, 0.1);
      border-color: #d4af37;
    }

    /* WAVEFORM BARS ANIMATION */
    @keyframes pulse-wave {
      0%, 100% { height: 4px; }
      50% { height: 26px; }
    }
    .wave-bar {
      width: 3px;
      background: #d4af37;
      border-radius: 9999px;
      animation: pulse-wave 1.2s infinite ease-in-out;
    }
    .wave-bar:nth-child(2) { animation-delay: 0.15s; }
    .wave-bar:nth-child(3) { animation-delay: 0.3s; }
    .wave-bar:nth-child(4) { animation-delay: 0.45s; }
    .wave-bar:nth-child(5) { animation-delay: 0.6s; }
    .wave-bar:nth-child(6) { animation-delay: 0.2s; }
    .wave-bar:nth-child(7) { animation-delay: 0.35s; }
    .wave-bar:nth-child(8) { animation-delay: 0.5s; }

    /* TOAST ANIMATION */
    @keyframes slide-down {
      from { transform: translateY(-100%) scale(0.95); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    .toast-animate {
      animation: slide-down 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* CUSTOM SCROLLBAR */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    .dark ::-webkit-scrollbar-track { background: rgba(14, 15, 20, 0.6); }
    .dark ::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.35); border-radius: 4px; }
    .light ::-webkit-scrollbar-track { background: rgba(250, 249, 245, 0.7); }
    .light ::-webkit-scrollbar-thumb { background: rgba(184, 134, 11, 0.4); border-radius: 4px; }
  </style>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const API_BASE = '/api';

    // Global API Helper
    async function apiRequest(endpoint, options = {}) {
      let token = localStorage.getItem('sp_access');
      const headers = { ...options.headers };
      if (token) headers['Authorization'] = `Bearer ${token}`;
      if (!(options.body instanceof FormData) && !headers['Content-Type']) {
        headers['Content-Type'] = 'application/json';
      }
      let config = { ...options, headers };
      if (options.body && !(options.body instanceof FormData) && typeof options.body === 'object') {
        config.body = JSON.stringify(options.body);
      }

      let res = await fetch(`${API_BASE}${endpoint}`, config);
      if (res.status === 401 && !options.isRetry) {
        const refresh = localStorage.getItem('sp_refresh');
        if (refresh) {
          try {
            const refreshRes = await fetch(`${API_BASE}/auth/token/refresh/`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ refresh })
            });
            if (refreshRes.ok) {
              const data = await refreshRes.json();
              localStorage.setItem('sp_access', data.access);
              return apiRequest(endpoint, { ...options, isRetry: true });
            }
          } catch(e) {}
        }
      }
      if (!res.ok) {
        let errData = {};
        try { errData = await res.json(); } catch(e) {}
        throw new Error(errData.error || errData.detail || `Server error: ${res.status}`);
      }
      return res.json();
    }

    // Helper: Trigger File Download in Browser
    function triggerDownload(content, filename, mimeType = 'text/plain') {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Helper: Format Active Duration
    function formatDuration(totalSeconds) {
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      if (mins < 60) return `${mins}m ${secs}s`;
      const hrs = Math.floor(mins / 60);
      const remMins = mins % 60;
      return `${hrs}h ${remMins}m`;
    }

    // Helper: Determine Academic Rank by XP
    function getAcademicRank(xp) {
      if (xp < 150) return { level: 1, title: 'Junior Scholar', nextXP: 150, progress: (xp / 150) * 100, badge: '🌱' };
      if (xp < 350) return { level: 2, title: 'Applied Researcher', nextXP: 350, progress: ((xp - 150) / 200) * 100, badge: '🔬' };
      if (xp < 650) return { level: 3, title: 'Master Fellow', nextXP: 650, progress: ((xp - 350) / 300) * 100, badge: '🧠' };
      if (xp < 1000) return { level: 4, title: 'Principal Investigator', nextXP: 1000, progress: ((xp - 650) / 350) * 100, badge: '⚡' };
      return { level: 5, title: 'Summa Cum Laude Laureate', nextXP: xp, progress: 100, badge: '👑' };
    }

    // ==========================================
    // ROOT APPLICATION COMPONENT
    // ==========================================
    function App() {
      const [theme, setTheme] = useState(() => localStorage.getItem('sp_theme') || 'dark');
      const [user, setUser] = useState(null);
      const [documents, setDocuments] = useState([]);
      const [selectedDoc, setSelectedDoc] = useState(null);
      const [selectedDocIds, setSelectedDocIds] = useState([]);
      const [activeTab, setActiveTab] = useState('chat');
      const [search, setSearch] = useState('');
      const [loadingDocs, setLoadingDocs] = useState(false);

      // Gamification, Session & Rewards State
      const [xpPoints, setXpPoints] = useState(() => parseInt(localStorage.getItem('sp_xp') || '250', 10));
      const [loginTime, setLoginTime] = useState(() => localStorage.getItem('sp_login_time') || new Date().toISOString());
      const [activityHistory, setActivityHistory] = useState(() => {
        try { return JSON.parse(localStorage.getItem('sp_history') || '[]'); } catch(e) { return []; }
      });
      const [userFeedback, setUserFeedback] = useState(() => {
        try { return JSON.parse(localStorage.getItem('sp_feedback') || 'null'); } catch(e) { return null; }
      });
      const [sessionSeconds, setSessionSeconds] = useState(0);
      const [rewardToast, setRewardToast] = useState(null);

      // Modals
      const [showAuth, setShowAuth] = useState(false);
      const [showUpload, setShowUpload] = useState(false);
      const [showExternalResolver, setShowExternalResolver] = useState(false);
      const [showProfile, setShowProfile] = useState(false);
      const [showGuide, setShowGuide] = useState(false);
      const [showCommandHub, setShowCommandHub] = useState(false);
      const [showCrossMatrixModal, setShowCrossMatrixModal] = useState(false);
      const [showAnalyticsModal, setShowAnalyticsModal] = useState(false);
      const [showFeedbackModal, setShowFeedbackModal] = useState(false);

      // Session Timer Interval
      useEffect(() => {
        const timer = setInterval(() => {
          setSessionSeconds(prev => prev + 1);
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      // Apply theme to <html> class
      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
          root.classList.remove('light');
        } else {
          root.classList.add('light');
          root.classList.remove('dark');
        }
        localStorage.setItem('sp_theme', theme);
      }, [theme]);

      const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');

      // Command Hub Shortcut (Ctrl+K / Cmd+K)
      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            setShowCommandHub(prev => !prev);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      const [showLandingPage, setShowLandingPage] = useState(false);

      useEffect(() => {
        const savedUser = localStorage.getItem('sp_user');
        if (savedUser) {
          try {
            setUser(JSON.parse(savedUser));
            fetchDocs();
          } catch(e) {}
        }
      }, []);

      const enterWorkspaceAsGuest = (notify = true) => {
        const guestUser = {
          id: 1,
          username: 'Researcher_Demo',
          email: 'researcher@scholarpulse.ai',
          profile: { academic_level: 'MCA Student', avatar: 'summa' }
        };
        localStorage.setItem('sp_user', JSON.stringify(guestUser));
        setUser(guestUser);
        setShowLandingPage(false);
        fetchDocs();
        if (notify) {
          awardXP(50, 'Research Studio Activated', 'Entered 1-Click Guest Researcher Studio with all 14 modules unlocked.', '⚡');
        }
      };

      useEffect(() => {
        if (user) fetchDocs(search);
      }, [search, user]);

      // Award Reward Points & Log Activity
      const awardXP = (amount, title, remark, icon = '⭐') => {
        const newXP = xpPoints + amount;
        setXpPoints(newXP);
        localStorage.setItem('sp_xp', newXP.toString());

        const newLog = {
          id: Date.now(),
          title,
          amount,
          remark,
          icon,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
        };

        const updatedHistory = [newLog, ...activityHistory].slice(0, 50);
        setActivityHistory(updatedHistory);
        localStorage.setItem('sp_history', JSON.stringify(updatedHistory));

        // Trigger Reward Toast
        setRewardToast({ amount, title, remark, icon });
        setTimeout(() => {
          setRewardToast(null);
        }, 4500);
      };

      const fetchDocs = async (q = '') => {
        setLoadingDocs(true);
        try {
          const docs = await apiRequest(`/workspace/documents/${q ? '?q=' + encodeURIComponent(q) : ''}`);
          setDocuments(docs);
        } catch (e) {
          console.error(e);
        } finally {
          setLoadingDocs(false);
        }
      };

      const handleLogin = async (username, password) => {
        const res = await apiRequest('/auth/login/', { method: 'POST', body: { username, password } });
        localStorage.setItem('sp_access', res.tokens.access);
        localStorage.setItem('sp_refresh', res.tokens.refresh);
        localStorage.setItem('sp_user', JSON.stringify(res.user));
        const now = new Date().toISOString();
        localStorage.setItem('sp_login_time', now);
        setLoginTime(now);
        setUser(res.user);
        setShowAuth(false);
        fetchDocs();
        awardXP(50, 'Session Initialized', `Welcome back, Researcher ${res.user.username}! Active workspace session loaded.`, '🚀');
      };

      const handleRegister = async (data) => {
        const res = await apiRequest('/auth/register/', { method: 'POST', body: data });
        localStorage.setItem('sp_access', res.tokens.access);
        localStorage.setItem('sp_refresh', res.tokens.refresh);
        localStorage.setItem('sp_user', JSON.stringify(res.user));
        const now = new Date().toISOString();
        localStorage.setItem('sp_login_time', now);
        setLoginTime(now);
        setUser(res.user);
        setShowAuth(false);
        fetchDocs();
        awardXP(100, 'Academic Account Created', 'Welcome to ScholarPulse! +100 Initial Research Grant XP Awarded.', '🎓');
      };

      const handleLogout = () => {
        localStorage.removeItem('sp_user');
        localStorage.removeItem('sp_access');
        localStorage.removeItem('sp_refresh');
        setUser(null);
        setShowLandingPage(true);
        setSelectedDoc(null);
        setSelectedDocIds([]);
      };

      const handleDeleteDoc = async (id) => {
        if (confirm('Delete this research paper and its vector index?')) {
          await apiRequest(`/workspace/documents/${id}/`, { method: 'DELETE' });
          setDocuments(prev => prev.filter(d => d.id !== id));
          setSelectedDocIds(prev => prev.filter(item => item !== id));
          if (selectedDoc?.id === id) setSelectedDoc(null);
        }
      };

      const toggleDocSelect = (id) => {
        setSelectedDocIds(prev => 
          prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]
        );
      };

      const PRESET_AVATARS_MAP = {
        'technomancer': { icon: '🧙‍♂️', color: 'from-purple-500 to-indigo-600' },
        'quantum': { icon: '⚛️', color: 'from-cyan-400 to-blue-600' },
        'neural': { icon: '🧠', color: 'from-pink-500 to-rose-600' },
        'deepspace': { icon: '🚀', color: 'from-amber-400 to-orange-600' },
        'genomic': { icon: '🧬', color: 'from-emerald-400 to-teal-600' },
        'summa': { icon: '🎓', color: 'from-yellow-400 to-amber-600' },
        'terminal': { icon: '💻', color: 'from-green-400 to-emerald-700' },
        'astro': { icon: '🪐', color: 'from-rose-400 to-purple-600' }
      };
      const userAvatar = user?.profile?.avatar ? (PRESET_AVATARS_MAP[user.profile.avatar] || PRESET_AVATARS_MAP['technomancer']) : PRESET_AVATARS_MAP['technomancer'];
      const rankInfo = getAcademicRank(xpPoints);

      return (
        <div className="min-h-screen flex flex-col transition-colors duration-300 relative">
          
          {/* FLOATING REWARD TOAST */}
          {rewardToast && (
            <div className="fixed top-20 right-6 z-50 max-w-sm w-full p-4 rounded-2xl glass-card border-gold-400 bg-obsidian-950/95 shadow-2xl toast-animate flex items-start gap-3 border-l-4 border-l-gold-400">
              <div className="w-10 h-10 rounded-xl bg-gold-500/20 text-gold-300 flex items-center justify-center text-xl flex-shrink-0">
                {rewardToast.icon}
              </div>
              <div className="flex-1">
                <div className="flex items-center justify-between">
                  <span className="font-extrabold text-xs text-gold-400">+{rewardToast.amount} RESEARCH XP</span>
                  <span className="text-[10px] text-slate-500 font-mono">Awarded</span>
                </div>
                <h4 className="font-bold text-xs text-white mt-0.5">{rewardToast.title}</h4>
                <p className="text-[11px] text-slate-300 mt-1 italic leading-tight">"{rewardToast.remark}"</p>
              </div>
            </div>
          )}

          {/* HEADER / NAVIGATION */}
          <nav className="h-16 border-b border-gold-500/20 bg-obsidian-900/90 dark:bg-obsidian-950/90 backdrop-blur-md sticky top-0 z-40 flex items-center justify-between px-4 sm:px-6 lg:px-8 text-white shadow-lg">
            {/* LOGO */}
            <div className="flex items-center gap-3 cursor-pointer" onClick={() => { setShowLandingPage(true); setSelectedDoc(null); }}>
              <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-gold-400 to-gold-600 border border-gold-300 flex items-center justify-center text-obsidian-950 font-black text-base shadow-md shadow-gold-500/20">⚡</div>
              <div>
                <span className="font-extrabold text-base tracking-tight">ScholarPulse <span className="text-gold-400 font-light">STUDIO</span></span>
                <span className="hidden sm:inline-block ml-2 px-1.5 py-0.5 rounded text-[9px] font-bold uppercase tracking-widest bg-gold-500/10 text-gold-400 border border-gold-500/30">v2.0 PRO</span>
              </div>
            </div>

            {/* UNIVERSAL SEARCH & CMD+K BUTTON */}
            {user && (
              <div className="flex-1 max-w-sm mx-4 hidden md:flex items-center">
                <div 
                  onClick={() => setShowCommandHub(true)} 
                  className="w-full flex items-center justify-between px-3.5 py-1.5 rounded-xl bg-obsidian-800/80 border border-gold-500/30 text-slate-300 text-xs hover:border-gold-400 cursor-pointer transition-all shadow-inner"
                >
                  <span className="flex items-center gap-2">
                    <span className="text-gold-400">🔍</span>
                    <span>Search or command...</span>
                  </span>
                  <kbd className="px-1.5 py-0.5 rounded bg-obsidian-900 border border-gold-500/40 text-[9px] text-gold-400 font-mono">⌘K</kbd>
                </div>
              </div>
            )}

            {/* ACTION BAR & STATS DOCK */}
            <div className="flex items-center gap-2">
              {/* HOME / LANDING PAGE TOGGLE */}
              {user && (
                <button
                  onClick={() => { setShowLandingPage(prev => !prev); setSelectedDoc(null); }}
                  className="btn-outline-gold text-xs flex items-center gap-1"
                  title="Toggle Landing Page / Workspace"
                >
                  <span>{showLandingPage ? '📚 Workspace' : '🏠 Overview'}</span>
                </button>
              )}

              {/* GAMIFIED XP BADGE (CLICKABLE) */}
              {user && (
                <div 
                  onClick={() => setShowAnalyticsModal(true)}
                  className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-gradient-to-r from-gold-500/15 to-amber-500/10 border border-gold-500/40 text-xs cursor-pointer hover:border-gold-300 transition-all shadow-sm group"
                  title="Click to view full Usage Analytics, Research XP, and History Log"
                >
                  <span className="text-sm">{rankInfo.badge}</span>
                  <div className="text-left leading-tight hidden sm:block">
                    <div className="font-extrabold text-gold-400 text-[11px] group-hover:underline">{xpPoints} XP • Lvl {rankInfo.level}</div>
                    <div className="text-[9px] text-slate-400 font-mono truncate">{rankInfo.title}</div>
                  </div>
                </div>
              )}

              {/* ACTIVE SESSION TIMER */}
              {user && (
                <div 
                  onClick={() => setShowAnalyticsModal(true)}
                  className="hidden lg:flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-obsidian-800/80 border border-slate-700 text-[11px] text-slate-300 font-mono cursor-pointer hover:border-slate-500"
                  title="Active Session Time"
                >
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span>{formatDuration(sessionSeconds)}</span>
                </div>
              )}

              {/* SATISFACTION RATING BUTTON */}
              {user && (
                <button 
                  onClick={() => setShowFeedbackModal(true)}
                  className="px-2.5 py-1.5 rounded-xl border border-gold-500/30 text-gold-400 text-xs font-semibold hover:bg-gold-500/10 transition-all flex items-center gap-1"
                  title="Give Satisfaction Rating & Feedback"
                >
                  <span>⭐</span> <span className="hidden xl:inline">{userFeedback ? `${userFeedback.rating}★ Rated` : 'Rate App'}</span>
                </button>
              )}

              {/* THEME TOGGLE */}
              <button 
                onClick={toggleTheme} 
                title="Toggle Theme"
                className="w-8 h-8 rounded-lg bg-obsidian-800 border border-gold-500/30 text-gold-400 flex items-center justify-center text-xs hover:border-gold-400 transition-all"
              >
                {theme === 'dark' ? '☀️' : '🌙'}
              </button>

              {user ? (
                <>
                  {/* DOI / ArXiv RESOLVER BUTTON */}
                  <button 
                    onClick={() => setShowExternalResolver(true)}
                    className="btn-outline-gold text-xs hidden sm:flex items-center gap-1.5"
                    title="Ingest paper via DOI / ArXiv"
                  >
                    <span>🌐</span> <span>DOI / arXiv</span>
                  </button>

                  {/* UPLOAD BUTTON */}
                  <button onClick={() => setShowUpload(true)} className="btn-gold flex items-center gap-1.5 text-xs">

    // ==========================================
    // MODULE 9: CITATIONS & BIBTEX STUDIO (MENDELEY / ZOTERO KILLER)
    // ==========================================
    function CitationsTab({ doc, onAwardXP }) {
      const [citations, setCitations] = useState(null);
      const [loading, setLoading] = useState(true);
      const [copiedKey, setCopiedKey] = useState(null);

      // Interactive Metadata Editor State
      const [isEditing, setIsEditing] = useState(false);
      const [metaTitle, setMetaTitle] = useState('');
      const [metaAuthors, setMetaAuthors] = useState('');
      const [metaYear, setMetaYear] = useState('');
      const [metaJournal, setMetaJournal] = useState('');
      const [metaDoi, setMetaDoi] = useState('');

      useEffect(() => {
        loadCitations();
      }, [doc]);

      const loadCitations = async () => {
        setLoading(true);
        try {
          const data = await apiRequest(`/workspace/documents/${doc.id}/citations/`);
          setCitations(data);
          setMetaTitle(data.title || doc.title);
          setMetaAuthors(Array.isArray(data.authors) ? data.authors.join(', ') : 'Author');
          setMetaYear(data.year || '2024');
          setMetaJournal(data.journal || 'Academic Research Journal');
          setMetaDoi(data.doi || '');
        } catch(e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      const handleApplyMetadata = (e) => {
        e?.preventDefault();
        const authorsList = metaAuthors.split(',').map(a => a.trim()).filter(a => a.length > 0);
        const authorsArr = authorsList.length > 0 ? authorsList : ['Author'];
        const year = metaYear || '2024';
        const title = metaTitle || doc.title;
        const journal = metaJournal || 'Academic Journal';
        const doi = metaDoi.trim();

        const firstAuthor = authorsArr[0];
        const firstAuthorSurname = firstAuthor.split(' ').slice(-1)[0] || 'Author';
        const tagKey = `${firstAuthorSurname.toLowerCase()}${year}${title.split(' ')[0].toLowerCase().replace(/[^a-zA-Z0-9]/g, '')}`;

        // Format authors for various standards
        const apaAuthors = authorsArr.map(a => {
          const parts = a.split(' ');
          const surname = parts.slice(-1)[0];
          const initial = parts[0] ? parts[0][0] + '.' : '';
          return `${surname}, ${initial}`;
        }).join(', ');

        const ieeeAuthors = authorsArr.map(a => {
          const parts = a.split(' ');
          const surname = parts.slice(-1)[0];
          const initial = parts[0] ? parts[0][0] + '.' : '';
          return `${initial} ${surname}`;
        }).join(', ');

        const inText = authorsArr.length === 1 
          ? `(${firstAuthorSurname}, ${year})`
          : authorsArr.length === 2 
            ? `(${authorsArr[0].split(' ').slice(-1)[0]} & ${authorsArr[1].split(' ').slice(-1)[0]}, ${year})`
            : `(${firstAuthorSurname} et al., ${year})`;

        const bibtex = `@article{${tagKey},
  title={${title}},
  author={${authorsArr.join(' and ')}},
  journal={${journal}},
  year={${year}}${doi ? `,\n  doi={${doi}}` : ''}
}`;

        const ris = `TY  - JOUR
TI  - ${title}
${authorsArr.map(a => `AU  - ${a}`).join('\n')}
PY  - ${year}
JO  - ${journal}
${doi ? `DO  - ${doi}\n` : ''}ER  -`;

        const updated = {
          title,
          authors: authorsArr,
          year,
          journal,
          doi,
          bibtex_key: tagKey,
          in_text_citation: inText,
          ieee_in_text: '[1]',
          apa: `${apaAuthors} (${year}). ${title}. ${journal}.${doi ? ` https://doi.org/${doi}` : ''}`,
          ieee: `${ieeeAuthors}, "${title}," ${journal}, ${year}.${doi ? ` doi: ${doi}` : ''}`,
          harvard: `${firstAuthorSurname}, ${firstAuthor[0] || 'A'} ${year}, '${title}', ${journal}.`,
          mla: `${firstAuthorSurname}, ${firstAuthor.split(' ')[0] || ''} et al. "${title}." ${journal} (${year}).`,
          chicago: `${firstAuthorSurname}, ${firstAuthor.split(' ')[0] || ''} et al. "${title}." ${journal} (${year}).`,
          bibtex,
          ris
        };

        setCitations(updated);
        setIsEditing(false);
        if (onAwardXP) onAwardXP(20, 'Citation Metadata Refined', `Customized author citation standard for '${title}'.`, '✏️');
      };

      const copyToClipboard = (text, key) => {
        navigator.clipboard.writeText(text);
        setCopiedKey(key);
        setTimeout(() => setCopiedKey(null), 2000);
        if (onAwardXP) onAwardXP(15, 'Citation Formatted', `Copied ${key.toUpperCase()} reference string for publication bibliography.`, '📜');
      };

      if (loading) {
        return (
          <div className="glass-card p-12 text-center">
            <div className="inline-block animate-spin text-2xl text-gold-400 mb-2">⚡</div>
            <p className="text-xs text-slate-400">Formatting academic bibliographic citations across all standards...</p>
          </div>
        );
      }

      return (
        <div className="space-y-6">
          {/* TOP EXPORT DOCK & ACTION TOOLBAR */}
          <div className="glass-card p-6 border-gold-500/30 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="text-2xl">🎓</span>
                <div>
                  <h3 className="font-extrabold text-base">Academic Citation Matrix & Exporter</h3>
                  <p className="text-xs text-slate-400 mt-0.5">Authoritative Mendeley, Zotero, Overleaf & EndNote bibliographic engine</p>
                </div>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-2.5">
              <button 
                onClick={() => setIsEditing(!isEditing)}
                className="px-3.5 py-2 rounded-xl bg-obsidian-800 border border-gold-500/40 text-gold-300 text-xs font-bold hover:border-gold-300 transition-all flex items-center gap-1.5"
              >
                <span>✏️</span> <span>{isEditing ? 'Hide Editor' : 'Edit Authors / Metadata'}</span>
              </button>
              <button 
                onClick={() => {
                  triggerDownload(citations.bibtex, `${citations.bibtex_key || 'citation'}.bib`, 'application/x-bibtex');
                  if (onAwardXP) onAwardXP(25, 'BibTeX Exported', 'Downloaded Overleaf-compatible .bib bibliography file.', '📥');
                }}
                className="btn-gold text-xs flex items-center gap-2 shadow-md"
              >
                <span>📥</span> Download .BIB (Overleaf)
              </button>
              <button 
                onClick={() => {
                  triggerDownload(citations.ris, `${citations.bibtex_key || 'citation'}.ris`, 'application/x-research-info-systems');
                  if (onAwardXP) onAwardXP(25, 'RIS Exported', 'Downloaded Zotero/Mendeley-compatible .ris citation file.', '📥');
                }}
                className="btn-outline-gold text-xs flex items-center gap-2"
              >
                <span>📥</span> Download .RIS (Mendeley)
              </button>
            </div>
          </div>

          {/* INTERACTIVE METADATA & AUTHORS EDITOR */}
          {isEditing && (
            <form onSubmit={handleApplyMetadata} className="glass-card p-5 border-gold-400 bg-obsidian-950/90 space-y-4 shadow-xl">
              <div className="flex justify-between items-center border-b border-gold-500/20 pb-2">
                <span className="text-xs font-black uppercase tracking-wider text-gold-400">✏️ Refine Authors, Title & Publication Metadata</span>
                <span className="text-[10px] text-slate-400">Updates all APA, IEEE, MLA & BibTeX entries live</span>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label className="text-[10px] font-bold text-slate-400 uppercase">Paper Title</label>
                  <input 
                    type="text" 
                    className="w-full text-xs px-3 py-2 rounded-xl bg-obsidian-900 border border-gold-500/30 text-white mt-1 focus:outline-none focus:border-gold-400"
                    value={metaTitle}
                    onChange={(e) => setMetaTitle(e.target.value)}
                  />
                </div>
                <div>
                  <label className="text-[10px] font-bold text-slate-400 uppercase">Author(s) (Comma separated)</label>
                  <input 
                    type="text" 
                    placeholder="e.g. Seth Gilbert, Nancy Lynch"
                    className="w-full text-xs px-3 py-2 rounded-xl bg-obsidian-900 border border-gold-500/30 text-white mt-1 focus:outline-none focus:border-gold-400"
                    value={metaAuthors}
                    onChange={(e) => setMetaAuthors(e.target.value)}
                  />
                </div>
                <div>
                  <label className="text-[10px] font-bold text-slate-400 uppercase">Journal / Conference / Venue</label>
                  <input 
                    type="text" 
                    placeholder="e.g. ACM SIGACT News / IEEE Transactions"
                    className="w-full text-xs px-3 py-2 rounded-xl bg-obsidian-900 border border-gold-500/30 text-white mt-1 focus:outline-none focus:border-gold-400"
                    value={metaJournal}
                    onChange={(e) => setMetaJournal(e.target.value)}
                  />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="text-[10px] font-bold text-slate-400 uppercase">Publication Year</label>
                    <input 
                      type="text" 
                      placeholder="e.g. 2002"
                      className="w-full text-xs px-3 py-2 rounded-xl bg-obsidian-900 border border-gold-500/30 text-white mt-1 focus:outline-none focus:border-gold-400"
                      value={metaYear}
                      onChange={(e) => setMetaYear(e.target.value)}
                    />
                  </div>
                  <div>
                    <label className="text-[10px] font-bold text-slate-400 uppercase">DOI (Optional)</label>
                    <input 
                      type="text" 
                      placeholder="e.g. 10.1145/564585.564601"
                      className="w-full text-xs px-3 py-2 rounded-xl bg-obsidian-900 border border-gold-500/30 text-white mt-1 focus:outline-none focus:border-gold-400 font-mono"
                      value={metaDoi}
                      onChange={(e) => setMetaDoi(e.target.value)}
                    />
                  </div>
                </div>
              </div>

              <div className="flex justify-end gap-2 pt-2">
                <button type="button" onClick={() => setIsEditing(false)} className="px-3 py-1.5 rounded-lg bg-obsidian-800 text-xs text-slate-300">
                  Cancel
                </button>
                <button type="submit" className="btn-gold text-xs px-5">
                  Apply & Recalculate All Citations →
                </button>
              </div>
            </form>
          )}

          {/* IN-TEXT CITATIONS ROW */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div className="glass-card p-4 flex justify-between items-center">
              <div>
                <div className="text-[10px] font-bold text-gold-400 uppercase tracking-wider">In-Text Citation (Author-Date)</div>
                <div className="font-mono text-sm mt-1 font-bold text-white">{citations.in_text_citation}</div>
              </div>
              <button 
                onClick={() => copyToClipboard(citations.in_text_citation, 'intext')}
                className="px-3 py-1.5 rounded-lg bg-obsidian-800 text-xs text-gold-400 border border-gold-500/30 hover:border-gold-400"
              >
                {copiedKey === 'intext' ? '✓ Copied' : 'Copy'}
              </button>
            </div>

            <div className="glass-card p-4 flex justify-between items-center">

    // ==========================================
    // MODULE 11: SCHOLARCAST DUAL-HOST PODCAST (NOTEBOOKLM KILLER)
    // ==========================================
    function ScholarCastTab({ doc, onAwardXP }) {
      const [podcast, setPodcast] = useState(null);
      const [loading, setLoading] = useState(false);
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentTurnIndex, setCurrentTurnIndex] = useState(-1);
      const [playbackRate, setPlaybackRate] = useState(1.0);
      const speechUtteranceRef = useRef(null);

      useEffect(() => {
        loadPodcast();
        return () => {
          if (window.speechSynthesis) window.speechSynthesis.cancel();
        };
      }, [doc]);

      const loadPodcast = async () => {
        setLoading(true);
        try {
          const data = await apiRequest(`/workspace/documents/${doc.id}/podcast/`, { method: 'POST' });
          setPodcast(data);
        } catch(e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      const startPlayback = (startIndex = 0) => {
        if (!podcast || !podcast.dialogue || podcast.dialogue.length === 0) return;
        if (!('speechSynthesis' in window)) {
          alert('Web Speech API is not supported in your browser.');
          return;
        }

        window.speechSynthesis.cancel();
        setIsPlaying(true);
        playTurn(startIndex);
        if (onAwardXP && startIndex === 0) {
          onAwardXP(40, 'ScholarCast Deep Dive', `Listening to 2-host audio podcast analysis of '${doc.title}'.`, '🎙️');
        }
      };

      const playTurn = (index) => {
        if (!podcast || !podcast.dialogue || index >= podcast.dialogue.length) {
          setIsPlaying(false);
          setCurrentTurnIndex(-1);
          return;
        }

        setCurrentTurnIndex(index);
        const item = podcast.dialogue[index];
        const utterance = new SpeechSynthesisUtterance(item.text);
        utterance.rate = playbackRate;

        if (item.speaker.includes('Vance') || item.role.includes('Scientist')) {
          utterance.pitch = 1.15;
        } else {
          utterance.pitch = 0.85;
        }

        utterance.onend = () => {
          playTurn(index + 1);
        };
        utterance.onerror = () => {
          setIsPlaying(false);
        };

        speechUtteranceRef.current = utterance;
        window.speechSynthesis.speak(utterance);
      };

      const stopPlayback = () => {
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        setIsPlaying(false);
        setCurrentTurnIndex(-1);
      };

      const togglePlayPause = () => {
        if (isPlaying) {
          stopPlayback();
        } else {
          startPlayback(currentTurnIndex >= 0 ? currentTurnIndex : 0);
        }
      };

      if (loading) {
        return (
          <div className="glass-card p-12 text-center">
            <div className="inline-block animate-spin text-3xl text-gold-400 mb-3">🎙️</div>
            <h3 className="font-bold text-sm">Synthesizing ScholarCast Deep Dive Podcast...</h3>
            <p className="text-xs text-slate-400 mt-1">Generating 2-host conversational dialogue and audio cues.</p>
          </div>
        );
      }

      if (!podcast) return null;

      return (
        <div className="space-y-6">
          {/* PODCAST PLAYER HERO */}
          <div className="glass-card p-6 border-gold-500/30 bg-gradient-to-r from-gold-500/10 via-transparent to-purple-500/10">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
              <div>
                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-gold-500/20 text-gold-400 text-[10px] font-extrabold uppercase tracking-wider mb-2">
                  <span>🎙️</span> AI Research Podcast • Dual Host
                </div>
                <h3 className="text-xl font-black">{podcast.episode_title}</h3>
                <p className="text-xs text-slate-400 mt-1">{podcast.key_takeaway}</p>
              </div>

              {/* DUAL HOST BADGES */}
              <div className="flex items-center gap-3">
                <div className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-obsidian-800/80 border border-gold-500/30">
                  <span className="text-base">👩‍🔬</span>
                  <div className="text-left text-[11px]">
                    <div className="font-bold text-gold-300">Dr. Evelyn Vance</div>
                    <div className="text-slate-400 text-[9px]">Lead Scientist</div>
                  </div>
                </div>
                <div className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-obsidian-800/80 border border-cyan-500/30">
                  <span className="text-base">👨‍💻</span>
                  <div className="text-left text-[11px]">
                    <div className="font-bold text-cyan-300">Marcus</div>
                    <div className="text-slate-400 text-[9px]">Systems Analyst</div>
                  </div>
                </div>
              </div>
            </div>

            {/* AUDIO CONTROL BAR */}
            <div className="p-4 rounded-xl bg-obsidian-950/80 border border-gold-500/30 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <button 
                  onClick={togglePlayPause} 
                  className="btn-gold text-xs px-5 py-2.5 flex items-center gap-2"
                >
                  <span>{isPlaying ? '⏸️ Pause' : '▶️ Play Podcast'}</span>
                </button>
                {isPlaying && (
                  <button 
                    onClick={stopPlayback} 
                    className="px-3 py-2 rounded-lg bg-obsidian-800 border border-slate-700 text-xs text-slate-300 hover:text-white"
                  >
                    ⏹️ Stop
                  </button>
                )}
              </div>

              {/* WAVEFORM VISUALIZER */}
              <div className="flex items-center gap-1 h-8 px-4">
                {[...Array(8)].map((_, i) => (
                  <div 
                    key={i} 
                    className={`wave-bar ${!isPlaying ? 'opacity-30 !animation-none !h-2' : ''}`}
                  ></div>
                ))}
              </div>

              {/* SPEED CONTROLS */}
              <div className="flex items-center gap-2">
                <span className="text-[10px] text-slate-400 uppercase font-bold">Speed:</span>
                {[1.0, 1.25, 1.5].map(rate => (
                  <button 
                    key={rate} 
                    onClick={() => setPlaybackRate(rate)}
                    className={`px-2 py-1 rounded text-[11px] font-mono ${playbackRate === rate ? 'bg-gold-500 text-obsidian-950 font-bold' : 'bg-obsidian-800 text-slate-400 hover:text-white'}`}
                  >
                    {rate}x
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* SYNCHRONIZED TRANSCRIPT DIALOGUE */}
          <div className="glass-card p-6 space-y-4">
            <div className="flex justify-between items-center border-b border-gold-500/20 pb-3">
              <span className="font-bold text-xs text-gold-400 uppercase tracking-wider">Synchronized Podcast Script</span>
              <button 
                onClick={() => {
                  const textContent = podcast.dialogue.map(d => `[${d.speaker}]: ${d.text}`).join('\n\n');
                  triggerDownload(textContent, `${doc.title}_podcast_transcript.txt`);
                }}
                className="text-xs text-gold-400 hover:underline"
              >
                📥 Download Transcript (.txt)
              </button>
            </div>

            <div className="space-y-3">
              {podcast.dialogue.map((item, idx) => {
                const isDrVance = item.speaker.includes('Vance');
                const isCurrent = currentTurnIndex === idx;

                return (
                  <div 
                    key={idx}
                    onClick={() => startPlayback(idx)}
                    className={`p-4 rounded-xl transition-all cursor-pointer border ${isCurrent ? 'bg-gold-500/15 border-gold-400 ring-1 ring-gold-400 shadow-md' : isDrVance ? 'bg-obsidian-800/30 border-gold-500/20 hover:border-gold-500/40' : 'bg-obsidian-800/30 border-cyan-500/20 hover:border-cyan-500/40'}`}
                  >
                    <div className="flex items-center justify-between mb-1.5">
                      <div className="flex items-center gap-2">
                        <span className="text-base">{isDrVance ? '👩‍🔬' : '👨‍💻'}</span>
                        <span className={`font-bold text-xs ${isDrVance ? 'text-gold-400' : 'text-cyan-400'}`}>{item.speaker}</span>
                        <span className="text-[10px] text-slate-500">({item.role})</span>
                      </div>
                      {isCurrent && (
                        <span className="px-2 py-0.5 rounded bg-gold-500 text-obsidian-950 text-[9px] font-extrabold uppercase animate-pulse">
                          Speaking Now
                        </span>
                      )}
                    </div>
                    <p className="text-xs text-slate-300 leading-relaxed font-sans pl-6">
                      {item.text}
                    </p>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    function FormulaCodeTab({ doc, onAwardXP }) {

      const [copied, setCopied] = useState(false);

      useEffect(() => {
        loadFormula();
      }, [doc]);

      const loadFormula = async (customQuery = '') => {
        setLoading(true);
        try {
          const data = await apiRequest(`/workspace/documents/${doc.id}/formula-code/`, { 
            method: 'POST', 
            body: { query: customQuery } 
          });
          setFormulaData(data);
          if (onAwardXP) onAwardXP(40, 'Formula-to-Code Compiled', `Compiled '${data.formula_name}' into executable Python/PyTorch logic.`, '🧮');
        } catch(e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      const copyCode = () => {
        if (!formulaData?.python_code) return;

              placeholder="Target equation / formula (e.g. Attention mechanism, Loss function, Cosine similarity)..."
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              onKeyDown={(e) => e.key === 'Enter' && loadFormula(query)}
            />
            <button 
              onClick={() => loadFormula(query)}

              className="btn-gold text-xs px-5"

      const [matrix, setMatrix] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        generateMatrix();
      }, [docIds]);

      const generateMatrix = async () => {
        setLoading(true);
        try {
          const data = await apiRequest('/workspace/documents/cross-matrix/', {
            method: 'POST',
            body: { doc_ids: docIds }
          });
          setMatrix(data);
        } catch(e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      const exportCSV = () => {
        if (!matrix || !matrix.papers) return;
        const headers = ["Title", "Domain", "Objective", "Methodology", "Dataset & Scale", "Key Findings", "Limitations"];
        const rows = matrix.papers.map(p => [
          `"${p.title.replace(/"/g, '""')}"`,
          `"${p.domain.replace(/"/g, '""')}"`,
          `"${p.objective.replace(/"/g, '""')}"`,
          `"${p.methodology.replace(/"/g, '""')}"`,
          `"${p.dataset_scale.replace(/"/g, '""')}"`,
          `"${p.key_findings.replace(/"/g, '""')}"`,
          `"${p.limitations.replace(/"/g, '""')}"`
        ]);
        const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        triggerDownload(csvContent, 'Cross_Paper_Synthesis_Matrix.csv', 'text/csv');
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">

                <span className="text-2xl">📊</span>
                <div>

                  <p className="text-xs text-slate-400">Comparing {docIds.length} Selected Papers</p>
                </div>
              </div>
              <div className="flex items-center gap-3">

    function ExternalResolverModal({ onClose, onSuccess }) {
      const [identifier, setIdentifier] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleResolve = async () => {
        if (!identifier.trim()) return;
        setLoading(true);
        setError('');
        try {
          const res = await apiRequest('/workspace/documents/resolve-external/', {
            method: 'POST',
            body: { identifier, save_to_workspace: true }
          });
          onSuccess(res.document);
        } catch(e) {
          setError(e.message || 'Failed to resolve DOI / ArXiv ID');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
          <div className="glass-card max-w-lg w-full p-6 border-gold-400 bg-obsidian-950 space-y-5 shadow-2xl">
            <div className="flex justify-between items-center border-b border-gold-500/20 pb-3">
              <div className="flex items-center gap-2">
                <span className="text-2xl">🌐</span>
                <h3 className="font-extrabold text-base">1-Click DOI / arXiv Paper Ingestion</h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
            </div>

            <p className="text-xs text-slate-400 leading-relaxed">
              Paste any DOI (e.g. <span className="font-mono text-gold-400">10.1145/3318464</span>), arXiv ID (e.g. <span className="font-mono text-gold-400">1706.03762</span>), or paper title to auto-fetch metadata, abstracts, and vector-index it.
            </p>

            <div className="space-y-2">
              <input 
                type="text"
                className="w-full text-xs px-4 py-3 rounded-xl bg-obsidian-900 border border-gold-500/40 text-white placeholder-slate-500 focus:outline-none focus:border-gold-400 font-mono"
                placeholder="e.g. 1706.03762 or 10.1145/..."

            </div>
          </div>
        </div>
      );

    // ==========================================
    // RAG CHAT & SUMMARY TAB
    // ==========================================
    function ChatTab({ doc, onAwardXP }) {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [summary, setSummary] = useState(doc.summary || '');
      const [summaryShort, setSummaryShort] = useState(doc.summary_short || '');
      const [summaryMode, setSummaryMode] = useState('detailed');
      const [summarizing, setSummarizing] = useState(false);

      useEffect(() => {
        setSummary(doc.summary || '');
        setSummaryShort(doc.summary_short || '');
      }, [doc]);

      const handleSend = async (e) => {
        e.preventDefault();
        if (!input.trim() || loading) return;

        const userMsg = { sender: 'user', text: input };
        setMessages(prev => [...prev, userMsg]);
        setInput('');
        setLoading(true);

        try {
          const res = await apiRequest(`/workspace/documents/${doc.id}/chat/`, {
            method: 'POST',
            body: { question: userMsg.text }
          });
          setMessages(prev => [...prev, { sender: 'ai', text: res.answer }]);
          if (onAwardXP) onAwardXP(10, 'Grounded RAG Query', `Explored semantic vector context for '${doc.title}'.`, '💬');
        } catch (err) {
          setMessages(prev => [...prev, { sender: 'ai', text: 'Error generating response: ' + err.message }]);
        } finally {
          setLoading(false);
        }
      };

      const handleSummarize = async (mode) => {
        setSummaryMode(mode);
        setSummarizing(true);
        try {
          const res = await apiRequest(`/workspace/documents/${doc.id}/summarize/`, {
            method: 'POST',
            body: { mode }
          });
          if (mode === 'short') setSummaryShort(res.summary_short);
          else setSummary(res.summary);
          if (onAwardXP) onAwardXP(30, 'Deep Summary Generated', `Compiled a ${mode} structured literature abstract for '${doc.title}'.`, '📄');
        } catch(e) {
          console.error(e);
        } finally {
          setSummarizing(false);
        }
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
          {/* CHAT WINDOW */}
          <div className="lg:col-span-7 flex flex-col h-[600px] glass-card p-4">
            <div className="flex items-center gap-2 border-b border-gold-500/20 pb-3 mb-3">
              <span className="text-xl">💬</span>
              <h3 className="font-bold text-sm">Interactive RAG Copilot</h3>
            </div>

            <div className="flex-1 overflow-y-auto space-y-4 pr-1">
              {messages.length === 0 ? (
                <div className="h-full flex flex-col items-center justify-center text-center p-6 space-y-3">
                  <div className="w-12 h-12 rounded-full bg-gold-500/10 border border-gold-500/30 flex items-center justify-center text-xl text-gold-400">
                    💡
                  </div>
                  <h4 className="font-bold text-xs">Ask Grounded Research Questions</h4>
                  <p className="text-[11px] text-slate-400 max-w-sm">
                    Inquire about mathematical proofs, baseline comparisons, dataset specifics, or request code expansions.
                  </p>
                </div>
              ) : (
                messages.map((m, idx) => (
                  <div key={idx} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[85%] p-3.5 rounded-2xl text-xs leading-relaxed ${m.sender === 'user' ? 'bg-gold-500 text-obsidian-950 font-medium' : 'bg-obsidian-900/80 border border-gold-500/20 text-slate-200'}`}>
                      {m.sender === 'ai' ? (
                        <div dangerouslySetInnerHTML={{ __html: marked.parse(m.text) }} />
                      ) : (
                        m.text
                      )}
                    </div>
                  </div>
                ))
              )}
              {loading && (
                <div className="flex items-center gap-2 text-xs text-gold-400">
                  <span className="animate-spin">⚡</span> Retrieving grounded context from ChromaDB...
                </div>
              )}
            </div>

            <form onSubmit={handleSend} className="mt-3 flex gap-2">
              <input
                type="text"
                className="flex-1 text-xs px-4 py-2.5 rounded-xl bg-obsidian-950 border border-gold-500/30 text-white placeholder-slate-500 focus:outline-none focus:border-gold-400"
                placeholder="Ask about this paper..."
                value={input}
                onChange={(e) => setInput(e.target.value)}
              />
              <button type="submit" disabled={loading || !input.trim()} className="btn-gold text-xs px-4">
                Send
              </button>
            </form>
          </div>

          {/* SUMMARY PANEL */}
          <div className="lg:col-span-5 glass-card p-5 flex flex-col h-[600px]">
            <div className="flex justify-between items-center border-b border-gold-500/20 pb-3 mb-3">
              <div className="flex items-center gap-2">
                <span className="text-xl">📄</span>
                <h3 className="font-bold text-sm">Deep Abstract & Summary</h3>
              </div>
              <div className="flex gap-1 bg-obsidian-950 p-1 rounded-lg border border-gold-500/30">
                <button 
                  onClick={() => handleSummarize('short')}
                  className={`px-2.5 py-1 rounded text-[10px] font-bold ${summaryMode === 'short' ? 'bg-gold-500 text-obsidian-950' : 'text-slate-400'}`}
                >
                  Executive
                </button>
                <button 
                  onClick={() => handleSummarize('detailed')}
                  className={`px-2.5 py-1 rounded text-[10px] font-bold ${summaryMode === 'detailed' ? 'bg-gold-500 text-obsidian-950' : 'text-slate-400'}`}
                >
                  Detailed
                </button>
              </div>
            </div>

            <div className="flex-1 overflow-y-auto pr-1 text-xs leading-relaxed">
              {summarizing ? (
                <div className="h-full flex items-center justify-center text-xs text-gold-400">
                  <span className="animate-spin mr-2">⚡</span> Generating structured summary...
                </div>
              ) : (summaryMode === 'short' ? summaryShort : summary) ? (
                <div 
                  className="space-y-3 prose dark:prose-invert prose-xs max-w-none text-slate-300"
                  dangerouslySetInnerHTML={{ __html: marked.parse(summaryMode === 'short' ? summaryShort : summary) }}
                />
              ) : (
                <div className="h-full flex flex-col items-center justify-center text-center space-y-3">
                  <p className="text-xs text-slate-400">No summary generated yet.</p>
                  <button onClick={() => handleSummarize('detailed')} className="btn-gold text-xs">
                    Generate Comprehensive Summary
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

                  <div className="text-xs text-slate-300 leading-relaxed font-serif">{q.answer}</div>
                </div>
              ))}
            </div>
          </div>

          {/* 5-MARK QUESTIONS */}
          <div className="glass-card p-6 space-y-4">
            <h4 className="font-bold text-xs text-gold-400 uppercase tracking-wider border-b border-gold-500/20 pb-2">
              5-Mark Architectural & Methodology Questions
            </h4>
            <div className="space-y-3">
              {viva.five_mark_questions?.map((q, i) => (
                <div key={i} className="p-4 rounded-xl bg-obsidian-900/60 border border-gold-500/20 space-y-1.5">
                  <div className="font-bold text-xs text-white">Q{i+1}: {q.question}</div>
                  <div className="text-xs text-slate-300 leading-relaxed font-serif whitespace-pre-line">{q.answer}</div>
                </div>
              ))}
            </div>
          </div>

          {/* EXTERNAL VIVA QUESTIONS */}
          <div className="glass-card p-6 space-y-4 border-rose-500/30">
            <h4 className="font-bold text-xs text-rose-400 uppercase tracking-wider border-b border-rose-500/20 pb-2">
              External Examiner Tough Viva Defense
            </h4>
            <div className="space-y-3">
              {viva.viva_questions?.map((q, i) => (
                <div key={i} className="p-4 rounded-xl bg-obsidian-900/60 border border-rose-500/20 space-y-1.5">
                  <div className="font-bold text-xs text-rose-300">Viva Challenge: {q.question}</div>
                  <div className="text-xs text-slate-300 leading-relaxed font-serif whitespace-pre-line">{q.answer}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // AUTH MODAL
    // ==========================================
    function AuthModal({ onClose, onLogin, onRegister, onGuestAccess }) {
      const [isLogin, setIsLogin] = useState(true);
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [email, setEmail] = useState('');
      const [academicLevel, setAcademicLevel] = useState('MCA Student');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          if (isLogin) {
            await onLogin(username, password);
          } else {
            await onRegister({ username, password, email, academic_level: academicLevel });
          }
        } catch(err) {
          setError(err.message || 'Authentication failed');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
          <div className="glass-card max-w-md w-full p-6 border-gold-400 bg-obsidian-950 space-y-5 shadow-2xl">
            <div className="flex justify-between items-center border-b border-gold-500/20 pb-3">
              <h3 className="font-extrabold text-base">{isLogin ? 'Sign In to ScholarPulse' : 'Create Student / Researcher Account'}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
            </div>

            {/* 1-CLICK INSTANT GUEST ACCESS */}
            <button 
              onClick={() => { onGuestAccess(); onClose(); }}
              className="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-gold-400 to-gold-600 text-obsidian-950 font-black text-xs shadow-lg shadow-gold-500/20 hover:scale-[1.02] transition-transform flex items-center justify-center gap-2"
            >
              <span>⚡</span> 1-Click Instant Guest Researcher Access (No Login Needed)
            </button>

            <div className="flex items-center gap-3 my-2">
              <div className="h-px bg-gold-500/20 flex-1"></div>
              <span className="text-[10px] text-slate-500 uppercase font-bold">OR CUSTOM CREDENTIALS</span>
              <div className="h-px bg-gold-500/20 flex-1"></div>
            </div>

            {error && <div className="p-3 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs">{error}</div>}

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="text-[10px] font-bold text-slate-400 uppercase">Username</label>
                <input 
                  type="text" 
                  required
                  className="w-full text-xs px-3.5 py-2.5 rounded-xl bg-obsidian-900 border border-gold-500/30 text-white mt-1 focus:outline-none focus:border-gold-400"
                  value={username}
                  onChange={(e) => setUsername(e.target.value)}
                />
              </div>

              {!isLogin && (
                <>
                  <div>
                    <label className="text-[10px] font-bold text-slate-400 uppercase">Email Address</label>
                    <input 
                      type="email" 
                      required
                      className="w-full text-xs px-3.5 py-2.5 rounded-xl bg-obsidian-900 border border-gold-500/30 text-white mt-1 focus:outline-none focus:border-gold-400"
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                    />
                  </div>
                  <div>
                    <label className="text-[10px] font-bold text-slate-400 uppercase">Academic Profile Level</label>
                    <select
                      className="w-full text-xs px-3.5 py-2.5 rounded-xl bg-obsidian-900 border border-gold-500/30 text-white mt-1 focus:outline-none focus:border-gold-400"
                      value={academicLevel}
                      onChange={(e) => setAcademicLevel(e.target.value)}
                    >
                      <option value="Beginner">Beginner</option>
                      <option value="Undergraduate">Undergraduate (BSc / BTech)</option>
                      <option value="MCA Student">MCA Student / Masters Candidate</option>
                      <option value="Researcher">PhD / Research Scholar</option>
                    </select>
                  </div>
                </>
              )}

              <div>
                <label className="text-[10px] font-bold text-slate-400 uppercase">Password</label>
                <input 
                  type="password" 
                  required
                  className="w-full text-xs px-3.5 py-2.5 rounded-xl bg-obsidian-900 border border-gold-500/30 text-white mt-1 focus:outline-none focus:border-gold-400"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                />
              </div>

              <button type="submit" disabled={loading} className="w-full btn-gold text-xs py-3 mt-2">
                {loading ? 'Authenticating...' : isLogin ? 'Sign In →' : 'Register Account →'}
              </button>
            </form>

            <div className="text-center text-xs text-slate-400 pt-2">
              {isLogin ? "Don't have an account?" : "Already registered?"}{' '}
              <button onClick={() => setIsLogin(!isLogin)} className="text-gold-400 font-bold hover:underline">
                {isLogin ? 'Sign Up' : 'Sign In'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // UPLOAD MODAL
    // ==========================================
    function UploadModal({ onClose, onSuccess }) {
      const [uploadType, setUploadType] = useState('file'); // 'file' or 'url'
      const [file, setFile] = useState(null);
      const [urlInput, setUrlInput] = useState('');
      const [title, setTitle] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleUpload = async (e) => {
        e.preventDefault();
        if (uploadType === 'file' && !file) return;
        if (uploadType === 'url' && !urlInput.trim()) return;

        setLoading(true);
        setError('');

        const formData = new FormData();
        if (uploadType === 'file') {
          formData.append('file', file);
        } else {
          formData.append('url_input', urlInput.trim());
        }
        if (title.trim()) formData.append('title', title.trim());

        try {
          const res = await apiRequest('/workspace/documents/', {
            method: 'POST',
            body: formData
          });
          onSuccess(res);
        } catch(err) {
          setError(err.message || 'Upload failed');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
          <div className="glass-card max-w-md w-full p-6 border-gold-400 bg-obsidian-950 space-y-5 shadow-2xl">
            <div className="flex justify-between items-center border-b border-gold-500/20 pb-3">
              <h3 className="font-extrabold text-base">Ingest Document, Paper or Web Link</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
            </div>

            {/* TAB SELECTOR */}
            <div className="flex gap-2 p-1 rounded-xl bg-obsidian-900 border border-gold-500/20 text-xs">
              <button 
                type="button" 
                onClick={() => setUploadType('file')}
                className={`flex-1 py-1.5 rounded-lg font-bold transition-all ${uploadType === 'file' ? 'bg-gold-500 text-obsidian-950 shadow-md' : 'text-slate-400 hover:text-white'}`}
              >
                📁 Local File Upload
              </button>
              <button 
                type="button" 
                onClick={() => setUploadType('url')}
                className={`flex-1 py-1.5 rounded-lg font-bold transition-all ${uploadType === 'url' ? 'bg-gold-500 text-obsidian-950 shadow-md' : 'text-slate-400 hover:text-white'}`}
              >
                🌐 Web / PDF Link
              </button>
            </div>

            {error && <div className="p-3 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs">{error}</div>}

            <form onSubmit={handleUpload} className="space-y-4">
              {uploadType === 'file' ? (
                <div>
                  <label className="text-[10px] font-bold text-slate-400 uppercase">Select File (PDF, DOCX, PPTX, TXT, or Image)</label>
                  <input 
                    type="file" 
                    required
                    accept=".pdf,.docx,.pptx,.txt,.png,.jpg,.jpeg,.webp"
                    className="w-full text-xs px-3.5 py-2.5 rounded-xl bg-obsidian-900 border border-gold-500/30 text-white mt-1"
                    onChange={(e) => {
                      const f = e.target.files[0];
                      setFile(f);
                      if (f && !title) setTitle(f.name.replace(/\.[^/.]+$/, ""));
                    }}
                  />
                </div>
              ) : (
                <div>
                  <label className="text-[10px] font-bold text-slate-400 uppercase">Paste Web Page or Direct PDF Link</label>
                  <input 
                    type="url" 
                    required
                    placeholder="https://arxiv.org/pdf/2303.08774.pdf or https://example.com/article"
                    className="w-full text-xs px-3.5 py-2.5 rounded-xl bg-obsidian-900 border border-gold-500/30 text-white mt-1 focus:outline-none focus:border-gold-400"
                    value={urlInput}
                    onChange={(e) => setUrlInput(e.target.value)}
                  />
                  <p className="text-[10px] text-slate-500 mt-1">Fetches full text or PDF bytes directly and indexes into vector memory.</p>
                </div>
              )}

              <div>
                <label className="text-[10px] font-bold text-slate-400 uppercase">Document Title (Optional)</label>
                <input 
                  type="text" 
                  placeholder="Custom title for vector index"
                  className="w-full text-xs px-3.5 py-2.5 rounded-xl bg-obsidian-900 border border-gold-500/30 text-white mt-1 focus:outline-none focus:border-gold-400"
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                />
              </div>

              <div className="flex justify-end gap-3 pt-2">
                <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl bg-obsidian-800 text-xs text-slate-300">Cancel</button>
                <button type="submit" disabled={loading || (uploadType === 'file' ? !file : !urlInput.trim())} className="btn-gold text-xs px-5">
                  {loading ? 'Fetching & Indexing Vectors...' : (uploadType === 'file' ? 'Upload & Vectorize →' : 'Fetch URL & Vectorize →')}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // PROFILE MODAL
    // ==========================================
    function ProfileModal({ onClose, user, onUpdateUser }) {
      const [academicLevel, setAcademicLevel] = useState(user.profile?.academic_level || 'MCA Student');
      const [avatar, setAvatar] = useState(user.profile?.avatar || 'technomancer');
      const [loading, setLoading] = useState(false);

      const handleSave = async () => {
        setLoading(true);
        try {
          const res = await apiRequest('/auth/profile/', {
            method: 'PUT',
            body: { academic_level: academicLevel, avatar }
          });
          onUpdateUser({ ...user, profile: res.profile });
          onClose();
        } catch(e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      const AVATARS = [
        { id: 'technomancer', label: 'Technomancer', icon: '🧙‍♂️' },
        { id: 'quantum', label: 'Quantum Physicist', icon: '⚛️' },
        { id: 'neural', label: 'Neural Architect', icon: '🧠' },
        { id: 'deepspace', label: 'Cosmologist', icon: '🚀' },
        { id: 'genomic', label: 'Bioinformatician', icon: '🧬' },
        { id: 'summa', label: 'Summa Scholar', icon: '🎓' },
        { id: 'terminal', label: 'Kernel Hacker', icon: '💻' },
        { id: 'astro', label: 'Astrophysicist', icon: '🪐' }
      ];

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
          <div className="glass-card max-w-md w-full p-6 border-gold-400 bg-obsidian-950 space-y-5 shadow-2xl">
            <div className="flex justify-between items-center border-b border-gold-500/20 pb-3">
              <h3 className="font-extrabold text-base">Researcher Profile Settings</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
            </div>

            <div className="space-y-4">
              <div>
                <label className="text-[10px] font-bold text-slate-400 uppercase">Select Avatar</label>
                <div className="grid grid-cols-4 gap-2 mt-2">
                  {AVATARS.map(a => (
                    <div 
                      key={a.id} 
                      onClick={() => setAvatar(a.id)}
                      className={`p-2.5 rounded-xl border text-center cursor-pointer transition-all ${avatar === a.id ? 'bg-gold-500/20 border-gold-400 text-gold-300' : 'bg-obsidian-900 border-slate-700 text-slate-400 hover:border-slate-500'}`}
                    >
                      <div className="text-xl mb-1">{a.icon}</div>
                      <div className="text-[9px] truncate">{a.label}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div>
                <label className="text-[10px] font-bold text-slate-400 uppercase">Academic Profile Tier</label>
                <select
                  className="w-full text-xs px-3.5 py-2.5 rounded-xl bg-obsidian-900 border border-gold-500/30 text-white mt-1"
                  value={academicLevel}
                  onChange={(e) => setAcademicLevel(e.target.value)}
                >
                  <option value="Beginner">Beginner</option>
                  <option value="Undergraduate">Undergraduate (BSc / BTech)</option>
                  <option value="MCA Student">MCA Student / Masters Candidate</option>
                  <option value="Researcher">PhD / Research Scholar</option>
                </select>
              </div>

              <div className="flex justify-end gap-3 pt-2">
                <button onClick={onClose} className="px-4 py-2 rounded-xl bg-obsidian-800 text-xs text-slate-300">Cancel</button>
                <button onClick={handleSave} disabled={loading} className="btn-gold text-xs px-5">
                  {loading ? 'Saving...' : 'Save Profile'}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // GUIDE & MODULES MODAL
    // ==========================================
    function GuideModal({ onClose }) {
      const MODULES = [
        { id: 1, title: 'User Registration & Profiles', desc: 'Secure JWT authentication with customizable academic profiles.' },
        { id: 2, title: 'Multimodal Research Workspace', desc: 'Centralized document hub with search and metadata management.' },
        { id: 3, title: 'Document & Diagram Parser (PDF/DOCX/PPTX/Images)', desc: 'Multi-format file extraction and Gemini Vision OCR.' },
        { id: 4, title: 'ChromaDB Vector Store', desc: 'Semantic embedding indexing with TF-IDF fallback mechanisms.' },
        { id: 5, title: 'RAG Assistant & Contextual Summarizer', desc: 'Grounded question answering with Gemini model gateways.' },
        { id: 6, title: 'AI Explain Mode (4 Levels)', desc: 'Adaptive concept explanation across 4 academic tiers.' },
        { id: 7, title: 'Presentation Assistant', desc: 'Automated 5-slide presentation generator with speaker scripts.' },
        { id: 8, title: 'Viva Defense Generator', desc: '2-Mark, 5-Mark, and External Viva Questions with model answers.' },
        { id: 9, title: 'Citation & Reference Hub (Mendeley/Zotero)', desc: 'APA, IEEE, Harvard, MLA, BibTeX and RIS export formats.' },
        { id: 10, title: 'Cross-Paper Synthesis Matrix (Elicit/SciSpace)', desc: 'Multi-document comparative analysis tables with CSV exports.' },

        { id: 13, title: 'Formula & Algorithm to Code Synthesizer', desc: 'Converts LaTeX equations to runnable Python & PyTorch code.' },
        { id: 14, title: 'DOI & ArXiv 1-Click Paper Ingestor', desc: 'Instant paper ingestion via CrossRef and arXiv open APIs.' }
      ];

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
          <div className="glass-card max-w-3xl w-full max-h-[85vh] flex flex-col p-6 border-gold-400 bg-obsidian-950 space-y-4 shadow-2xl">
            <div className="flex justify-between items-center border-b border-gold-500/20 pb-3">
              <div>
                <h3 className="font-extrabold text-lg">ScholarPulse AI Architecture & Module Guide</h3>
                <p className="text-xs text-gold-400 font-bold">14 Fully Integrated Multimodal Research Modules</p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
            </div>

            <div className="flex-1 overflow-y-auto space-y-2.5 pr-2">
              {MODULES.map(m => (
                <div key={m.id} className="p-3 rounded-xl bg-obsidian-900 border border-gold-500/20 flex items-start gap-3">
                  <span className="w-6 h-6 rounded-lg bg-gold-500/20 border border-gold-500/40 text-gold-400 font-black text-xs flex items-center justify-center flex-shrink-0">
                    {m.id}
                  </span>
                  <div>
                    <h4 className="font-bold text-xs text-white">{m.title}</h4>
                    <p className="text-[11px] text-slate-400">{m.desc}</p>
                  </div>
                </div>
              ))}
            </div>

            <div className="pt-2 flex justify-end">
              <button onClick={onClose} className="btn-gold text-xs px-6">Close Guide</button>
            </div>
          </div>
        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
